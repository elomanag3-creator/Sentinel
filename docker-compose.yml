# Audits the HOST (not the container). Root inside the container + host mounted READ-ONLY at /host.
# Nothing on the host is ever modified; results and the model live in the `sentinel-data` volume.
services:
  sentinel:
    build: .
    restart: unless-stopped
    network_mode: host          # see the host's listening ports
    pid: host                   # port -> process name
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /:/host:ro
      - sentinel-data:/data
      - ./docker/sentinel.toml:/etc/sentinel/sentinel.toml:ro
    environment:
      SENTINEL_HOST_ROOT: /host
    # command: ["daemon"]       # default. One-off commands: docker compose run --rm sentinel audit

  web:                          # dashboard + API, read-only view of the same database (no host mount, no token = no actions)
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8080:8080"]     # loopback only; put a reverse proxy + SENTINEL_API_TOKEN in front to expose it
    volumes:
      - sentinel-data:/data
      - ./docker/sentinel.toml:/etc/sentinel/sentinel.toml:ro
    command: ["serve", "--host", "0.0.0.0", "--allow-open"]
    depends_on: [sentinel]

volumes:
  sentinel-data:
